name: Validate design system
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Verify One task entry without contacting production
        run: |
          bash scripts/bootstrap-one.sh
          export PATH="$PWD/.cache/one/bin:$PATH"
          one mise trust
          one run website:deploy --ui stream -- --dry-run
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: deernova-packages-and-website
          path: |
            releases/*.tgz
            dist/
