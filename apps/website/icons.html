<!doctype html>
<html lang="zh-CN" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deernova Icons</title>
  <meta name="description" content="Deernova Icons：AI 应用常用的线性图标，基于 Lucide，24×24 网格、1.75 描边。npm 包 @deernova/icons。">
  <script>try { const theme = localStorage.getItem('deernova-theme'); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="icon" type="image/png" href="assets/deernova-studio-icon.png">
  <link rel="apple-touch-icon" href="assets/deernova-studio-icon.png">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/guide.css">
  <link rel="stylesheet" href="styles/packages.css">
  <style>
{{referenceCss}}
  </style>
  <script type="module" src="scripts/site.js"></script>
  <script type="module" src="scripts/guide.js"></script>
</head>
<body class="guide-page">
{{iconSprite}}
<a class="skip" href="#main">跳到正文</a>
<header class="masthead guide-masthead">
  <a class="wordmark" href="./" aria-label="Deernova 首页">deernova<span>.</span></a>
  <a class="masthead-product" href="#overview">
    {{markIcons}}
    <span class="product-name">Deernova Icons</span>
  </a>
  <nav class="masthead-actions" aria-label="快捷导航">
    <a class="masthead-action" href="https://github.com/deernova-studio" target="_blank" rel="noopener noreferrer" aria-label="GitHub 组织（新标签页）" data-tooltip="GitHub 组织"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.3-4.3-2.1-6-2.6m12 5v-3.4c0-1 .1-1.5-.5-2.1 3-.3 6.2-1.5 6.2-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.4-3.7 1.4a12.7 12.7 0 0 0-6.8 0C6.1 1.6 5 2 5 2a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.2 6.4 6.2 6.7-.5.5-.8 1.1-.7 2.1v3.4"/></svg></a>
    <button class="theme-toggle masthead-action" type="button" data-theme-toggle aria-label="切换外观" data-tooltip="切换外观"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
  </nav>
</header>

<div class="guide">
  <aside class="toc" aria-label="目录">
    <details class="toc-details" open>
      <summary>目录</summary>
      <nav>
{{iconsNav}}
      </nav>
    </details>
  </aside>
  <main class="guide-main" id="main">
{{iconsDocs}}
    <footer class="guide-footer">
      <span>deernova.</span>
      <span>v{{version}} · <a href="./">首页</a> · <a href="https://github.com/deernova-studio" target="_blank" rel="noopener noreferrer">GitHub ↗</a></span>
    </footer>
    <div class="site-filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备2026076994号-1</a></div>
  </main>
</div>
</body>
</html>
