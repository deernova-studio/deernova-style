<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deernova UI</title>
  <link rel="preload" href="assets/milu-cycle-gather.png" as="image">
  <link rel="preload" href="assets/milu-cycle-flight.png" as="image">
  <link rel="preload" href="assets/milu-cycle-support.png" as="image">
  <link rel="preload" href="assets/milu-cycle-recover.png" as="image">
  <meta name="description" content="Deernova UI：一套只用黑、白、灰的界面设计语言，写给 agent 读。">
  <script>try { const theme = localStorage.getItem('deernova-theme'); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/home.css">
  <script src="scripts/site.js" defer></script>
  <script type="module" src="scripts/meadow.js"></script>
</head>
<body class="home">
  <header class="masthead masthead-float">
    <a class="wordmark" href="./" aria-label="Deernova 首页">deernova<span>.</span></a>
    <nav class="masthead-nav" aria-label="主导航">
      <a href="guide.html">完整规范</a>
      <a href="https://github.com/deernova-studio/deernova-style">GitHub</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换外观"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg><span data-theme-label>自动</span></button>
  </header>

  <main id="main" class="stage">
    <h1 class="sr-only">Deernova UI</h1>
    <div class="meadow" data-meadow>
      <canvas aria-hidden="true"></canvas>
      <p class="sr-only">一只白色的麋鹿舒展着鹿角奔跑：穿过积云下的草原，穿过阳光照进来的森林，跑上银河下的山脊，再回到清晨的草原。</p>
    </div>
  </main>
</body>
</html>
