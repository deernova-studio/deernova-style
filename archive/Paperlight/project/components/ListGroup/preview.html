<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script><meta charset="utf-8"><title>ListGroup</title></head>
<body>
<div class="pl-stage" style="padding:0">
  <div class="pl-listwrap">
    <div class="pl-list-head">账号</div>
    <div class="pl-list">
      <div class="pl-list-row has-icon"><span class="pl-list-icon"><svg class="pl-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></span>个人资料<span class="pl-list-value">林一</span><svg class="pl-icon pl-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="pl-list-row has-icon"><span class="pl-list-icon"><svg class="pl-icon" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6.6-4.2 3.8 1.2 5.5L12 16l-5 2.9 1.2-5.5L4 9.6l5.6-.6z"/></svg></span>订阅<span class="pl-list-value">全家桶 · 年付</span><svg class="pl-icon pl-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="pl-list-head" style="margin-top:var(--space-6)">同步</div>
    <div class="pl-list">
      <div class="pl-list-row has-icon"><span class="pl-list-icon"><svg class="pl-icon" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z"/></svg></span>iCloud 同步<span class="pl-switch" role="img" aria-label="已开启"></span></div>
      <div class="pl-list-row has-icon"><span class="pl-list-icon"><svg class="pl-icon" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20h4"/></svg></span>同步完成时通知我<span class="pl-switch is-off" role="img" aria-label="已关闭"></span></div>
    </div>
    <div class="pl-list-foot">关闭 iCloud 同步后，新笔记只保存在这台设备上。</div>
  </div>
</div>
</body>
</html>
