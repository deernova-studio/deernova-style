<!-- @dsCard group="Actions" height=130 subtitle="在 2–4 个视图之间切换" -->
<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script><meta charset="utf-8"><title>Segmented</title></head>
<body>
<div class="pl-stage pl-stack" style="align-items:flex-start">
  <div class="pl-row">
    <span class="pl-note" style="width:56px">macOS</span>
    <div class="pl-seg" role="group" aria-label="视图">
      <button aria-pressed="true">列表</button><button aria-pressed="false">卡片</button><button aria-pressed="false">日历</button>
    </div>
  </div>
  <div class="pl-row">
    <span class="pl-note" style="width:56px">iOS</span>
    <div class="pl-seg pl-seg-ios" role="group" aria-label="范围">
      <button aria-pressed="false">今天</button><button aria-pressed="true">本周</button><button aria-pressed="false">本月</button>
    </div>
  </div>
</div>
</body>
</html>
