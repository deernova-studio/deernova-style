<!-- @dsCard group="Feedback" height=420 subtitle="iOS 底部弹窗，系统玻璃" -->
<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script><meta charset="utf-8"><title>Sheet</title>
<style>
  .scene { position: relative; height: 420px; overflow: hidden; background: var(--canvas); display: flex; justify-content: center; }
  .under { position: absolute; inset: 0; padding: var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); align-items: center; }
  .under .pl-card { width: 359px; }
  .shade { position: absolute; inset: 0; background: var(--scrim); }
  .pl-sheet { position: absolute; bottom: 8px; }
</style>
</head>
<body>
<div class="scene">
  <div class="under" aria-hidden="true">
    <div class="pl-card"><p class="pl-card-title">本周回顾</p><p class="pl-card-body">完成 12 条笔记，整理了两个项目的待办。</p></div>
    <div class="pl-card"><p class="pl-card-title">读书摘录</p><p class="pl-card-body">好的工具会退到背景里。</p></div>
  </div>
  <div class="shade"></div>
  <div class="pl-sheet pl-glass" role="dialog" aria-label="开通全家桶">
    <div class="pl-grabber"></div>
    <h3>开通全家桶</h3>
    <p>一次订阅，旗下所有应用的高级功能都可以使用，AI 次数在各应用之间共享。</p>
    <div class="pl-stack">
      <button class="pl-btn pl-btn-primary pl-btn-ios-lg">¥168 / 年，免费试用 7 天</button>
      <button class="pl-btn pl-btn-plain pl-btn-ios-lg" style="font-weight:500">暂不需要</button>
    </div>
  </div>
</div>
</body>
</html>
