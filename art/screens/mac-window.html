<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mac 窗口</title>
<script>document.documentElement.dataset.theme = location.hash.slice(1) || 'light';</script>
<style>
{{tokens}}
{{reference}}
/*
 * Mac 窗口示意（macOS 26）。系统的部分（窗口、红绿灯、玻璃侧边栏、玻璃工具栏）按 Apple HIG 里 macOS 26
 * 备忘录截图的比例画：红绿灯直径 12、间距 20，中心离窗口左上角 22；工具栏按钮 34，和红绿灯在同一条线上；
 * 窗口圆角 22，悬浮侧边栏和窗口同心。内容区用 Deernova 的桌面 token 和组件参考写法。
 */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 960px; height: 590px; padding: 16px; background: var(--surface-sunken); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.win { position: relative; display: flex; height: 100%; overflow: hidden; border: var(--stroke-line) solid var(--line); border-radius: 22px; background: var(--canvas); box-shadow: var(--shadow-float); color: var(--ink); }
.glass { border: var(--stroke-line) solid var(--glass-stroke); background: var(--glass-fill); box-shadow: var(--shadow-glass); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)); backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate)); }

/* 系统侧边栏：悬浮玻璃面板，圆角 = 22 − 8，和窗口同心；行高、字号是系统的。 */
.sys-sidebar { display: flex; flex-direction: column; flex: none; width: 236px; margin: 8px; padding: 8px 10px; border-radius: 14px; }
.lights { display: flex; gap: 8px; height: 12px; margin: 0 0 16px -2px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
.sys-head { padding: 12px 8px 4px; color: var(--ink-tertiary); font: 600 11px/14px var(--font-sans); }
.sys-item { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--ink); font: 400 13px/1 var(--font-sans); white-space: nowrap; overflow: hidden; }
.sys-item .dn-icon { width: 16px; height: 16px; color: var(--ink-secondary); }
.sys-item.is-selected { background: var(--fill-selected); }
.sys-item span { overflow: hidden; text-overflow: ellipsis; }

/* 系统工具栏：按钮 34，竖直中心离窗口顶部 22，和红绿灯对齐；按钮组是一块玻璃胶囊。 */
.main { position: relative; flex: 1; min-width: 0; }
.sys-toolbar { position: absolute; z-index: 2; top: 5px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; height: 34px; }
.sys-title { display: grid; line-height: 1.2; }
.sys-title b { font: 600 13px/16px var(--font-sans); }
.sys-title small { color: var(--ink-tertiary); font: 400 11px/14px var(--font-sans); }
.sys-spacer { flex: 1; }
.sys-glass { display: inline-flex; align-items: center; height: 34px; border-radius: 17px; }
.sys-glass i { display: grid; place-items: center; width: 34px; height: 34px; color: var(--ink); }
.sys-glass .dn-icon { width: 16px; height: 16px; stroke-width: 1.9; }

/* 内容区：Deernova 桌面 token。 */
.content { position: absolute; inset: 0; display: flex; justify-content: center; padding: 64px 44px 0; }
.content .dn-thread { width: 100%; max-width: var(--content-max); }
.dock { position: absolute; left: 32px; right: 32px; bottom: 14px; display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="win">
  <nav class="sys-sidebar glass" aria-label="侧边栏">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="sys-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>新建对话</span></div>
    <div class="sys-item"><svg class="dn-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span>搜索</span></div>
    <div class="sys-head">工作</div>
    <div class="sys-item is-selected"><span>把周报整理成三条要点</span></div>
    <div class="sys-item"><span>首页改版的信息层级</span></div>
    <div class="sys-head">生活</div>
    <div class="sys-item"><span>下周去杭州的行程和预算</span></div>
    <div class="sys-item"><span>订阅页文案改三版</span></div>
  </nav>
  <section class="main">
    <div class="sys-toolbar">
      <div class="sys-title"><b>把周报整理成三条要点</b><small>今天 09:41</small></div>
      <span class="sys-spacer"></span>
      <span class="sys-glass glass"><i><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M15.5 4.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg></i></span>
      <span class="sys-glass glass"><i><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/></svg></i><i><svg class="dn-icon" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg></i></span>
    </div>
    <div class="content">
      <div class="dn-thread">
        <div class="dn-message-user">帮我把这份周报整理成三条要点</div>
        <details class="dn-activity"><summary>已读取 2 个文件<svg class="dn-icon" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary></details>
        <div class="dn-message-assistant">
          <p>这周的进展可以归成三件事：</p>
          <ul>
            <li><strong>首页改版定稿。</strong>信息层级按「最近、收藏、全部」排列。</li>
            <li><strong>同步问题修复。</strong>离线编辑后重复保存的问题已经解决。</li>
            <li><strong>订阅转化提升。</strong>年付转化率从 3.1% 升到 4.4%。</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="dock">
      <div class="dn-composer-stack">
        <div class="dn-composer">
          <button class="dn-icon-button" type="button" aria-label="添加附件"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <textarea rows="1" aria-label="消息" placeholder="继续追问，或拖入文件"></textarea>
          <button class="dn-icon-button" type="button" aria-label="语音输入"><svg class="dn-icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="dn-send" type="button" aria-label="发送" disabled><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
        <div class="dn-composer-meta"><span class="dn-meta-button"><b>标准模式</b></span><span class="dn-context-ring"></span></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
