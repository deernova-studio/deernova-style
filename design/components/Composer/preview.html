<!-- @dsCard group="Input" height=240 subtitle="多行输入与发送" -->
<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script><meta charset="utf-8"><title>Composer</title></head>
<body>
<div class="dn-stage dn-stack" style="align-items:center">
  <div class="dn-composer">
    <div class="dn-attach"><svg class="dn-icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>周报草稿.md</div>
    <textarea id="c1" rows="2" aria-label="消息" placeholder="写点什么，或拖入文件">帮我把这份周报整理成三条要点</textarea>
    <div class="dn-composer-bar">
      <button class="dn-iconbtn" aria-label="添加附件"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="dn-chip">标准模式<svg class="dn-icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="dn-spacer"></span>
      <span class="dn-note" style="margin-right:var(--space-2)">剩余 42 次</span>
      <button class="dn-send" aria-label="发送"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>
  <div class="dn-composer" style="box-shadow:none">
    <textarea id="c2" rows="1" aria-label="消息" placeholder="写点什么，或拖入文件"></textarea>
    <div class="dn-composer-bar">
      <button class="dn-iconbtn" aria-label="添加附件"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="dn-spacer"></span>
      <button class="dn-send" disabled aria-label="发送"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
