<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script>
<meta charset="utf-8">
<title>Deernova</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .slab { fill: var(--ink); }
  .mid { fill: var(--line-control); }
  .warm { fill: var(--ink-secondary); }
  .state { fill: var(--success); }
  .blk { rx: var(--radius-md); }
  .glass { fill: var(--glass-fill); stroke: var(--glass-stroke); stroke-width: 1; }
  .cap44 { rx: 22px; }
  .cap28 { rx: 14px; }
  .cap16 { rx: 8px; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-size: 80px; line-height: 0.92; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-6) 0 0 3px; font-size: 14px; line-height: 20px; color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink slab 168×280 bled off the top (black in light, white in dark: the brand is its contrast) · line-control 288×192 bleeding off the right edge · ink-secondary 120×76 bled off the top · success 48×16 once (the only hue, a state colour, kept small); together about 40% of 960×288
  arrangement one tall ink slab with a mid-grey plane beside it, bottoms on one line space-6 above the edge, gutters space-4
  pattern     glass capsules from "纸面承载内容，玻璃承载操作": a 44pt tab-bar capsule and a 44pt circle floating across the slab/plane seam, a 28pt control group on the grey plane, all glass-fill with a glass-stroke edge
  scales      gutters space-4, capsule gap space-3 (GlassEffectContainer spacing); block corners radius-md; capsules at control-ios (44) and control-mac-lg (28), rx half their height
-->
<rect class="slab blk" x="24" y="-16" width="168" height="280" rx="8"/>
<rect class="warm blk" x="208" y="-20" width="120" height="76" rx="8"/>
<rect class="state cap16" x="344" y="40" width="48" height="16" rx="8"/>
<rect class="mid blk" x="208" y="72" width="288" height="192" rx="8"/>
<rect class="glass cap44" x="56" y="196" width="176" height="44" rx="22"/>
<rect class="glass cap44" x="244" y="196" width="44" height="44" rx="22"/>
<rect class="glass cap28" x="344" y="92" width="28" height="28" rx="14"/>
<rect class="glass cap28" x="380" y="92" width="76" height="28" rx="14"/>
</svg>
</div>
<div class="words">
<h1 class="name">Deernova</h1>
<p class="tag">纸面承载内容，玻璃承载操作。</p>
</div>
</div>
</body>
</html>
