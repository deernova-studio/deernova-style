<!-- @dsCard group="Layouts" height=590 width=960 subtitle="组合示例：Mac 窗口" -->
<!doctype html>
<html lang="zh-CN">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){function a(){var t=location.hash.slice(1),r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}a();addEventListener("hashchange",a);})();</script><meta charset="utf-8"><title>MacWindow</title>
<style>
  body { background: var(--surface-sunken); }
  .win { position: relative; margin: 16px; height: 528px; border-radius: var(--radius-lg); background: var(--canvas); border: var(--stroke-hairline) solid var(--line); box-shadow: var(--shadow-float); overflow: hidden; display: flex; }
  .side.dn-glass { margin: 8px; width: var(--sidebar-mac); flex: none; border-radius: var(--radius-lg); padding: var(--space-2); display: flex; flex-direction: column; gap: 1px; }
  .lights { display: flex; gap: 8px; padding: 6px 6px 12px; }
  .lights span { width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--line-control); }
  .main { flex: 1; position: relative; min-width: 0; }
  .toolbar { position: absolute; top: 10px; left: 12px; right: 16px; display: flex; align-items: center; gap: var(--space-2); z-index: 2; }
  .toolbar .title { font-size: 13px; font-weight: 600; color: var(--ink); padding-left: var(--space-1); }
  .toolbar .dn-glass-group .dn-glass-btn { width: 32px; height: 32px; }
  .toolbar .dn-glass-group .dn-icon { width: 16px; height: 16px; }
  .scroll { position: absolute; inset: 0; padding: 56px var(--space-4) 0; display: flex; justify-content: center; }
  .scroll .dn-thread { max-width: 600px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; padding: 0 var(--space-4); }
</style>
</head>
<body>
<div class="win">
  <nav class="side dn-glass" aria-label="侧边栏">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="dn-side-text">新建对话</span><span class="dn-count">⌘N</span></div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span class="dn-side-text">搜索</span></div>
    <div class="dn-side-head">项目</div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="dn-side-text">工作</span><span class="dn-count">41</span></div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="dn-side-text">生活</span><span class="dn-count">17</span></div>
    <div class="dn-side-head">最近</div>
    <div class="dn-side-item is-selected"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></svg><span class="dn-side-text">把周报整理成三条要点</span></div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></svg><span class="dn-side-text">下周去杭州的行程和预算</span></div>
    <div class="dn-side-item"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></svg><span class="dn-side-text">订阅页文案改三版</span></div>
  </nav>
  <section class="main">
    <div class="toolbar">
      <span class="title">把周报整理成三条要点</span>
      <span class="dn-spacer"></span>
      <div class="dn-glass dn-glass-group">
        <button class="dn-glass-btn" aria-label="分享"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/></svg></button>
        <button class="dn-glass-btn" aria-label="更多"><svg class="dn-icon" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg></button>
      </div>
    </div>
    <div class="scroll">
      <div class="dn-thread">
        <div class="dn-msg-user">帮我把这份周报整理成三条要点</div>
        <div class="dn-steps">
          <div class="dn-step dn-step-ok"><svg class="dn-icon dn-glyph" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><span class="dn-step-name">读取</span><span class="dn-step-text">周报草稿.md、10 月数据.csv</span><span class="dn-step-meta">0.4 秒</span></div>
        </div>
        <div class="dn-msg-assistant">
          <p>这周的进展可以归成三件事：</p>
          <p><strong>首页改版定稿。</strong>信息层级按「最近、收藏、全部」排列，下周三前交给开发。<br><strong>同步问题修复。</strong>离线编辑后重复保存的问题已经解决。<br><strong>订阅转化提升。</strong>全家桶年付的转化率从 3.1% 升到 4.4%。</p>
        </div>
      </div>
    </div>
    <div class="dock">
      <div class="dn-composer">
        <textarea id="mw" rows="1" aria-label="消息" placeholder="继续追问，或拖入文件"></textarea>
        <div class="dn-composer-bar">
          <button class="dn-iconbtn" aria-label="添加附件"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="dn-chip">标准模式<svg class="dn-icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <span class="dn-spacer"></span>
          <button class="dn-send" disabled aria-label="发送"><svg class="dn-icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
