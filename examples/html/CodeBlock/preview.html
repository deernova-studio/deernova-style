<pre><code><span class="tk-com">// 统计本周完成的笔记数</span>
<span class="tk-kw">let</span> start = calendar.<span class="tk-type">dateInterval</span>(of: .weekOfYear, for: .now)!.start
<span class="tk-kw">let</span> done = notes.filter { $0.completedAt &gt;= start }
